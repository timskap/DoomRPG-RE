<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doom RPG (Web)</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #111; color: #ccc;
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  #wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 16px; }
  h1 { font-size: 18px; font-weight: 600; margin: 4px 0; color: #e44; letter-spacing: 1px; }
  #canvas {
    background: #000;
    border: 1px solid #333;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    width: 960px; height: 720px;          /* 320x240 internal, scaled 3x */
    max-width: 96vw; max-height: 78vh;
    outline: none;
  }
  #status { min-height: 1.2em; font-size: 13px; color: #9a9; }
  #help { font-size: 12px; color: #888; max-width: 960px; line-height: 1.6; }
  #help b { color: #bbb; }
  kbd {
    background: #222; border: 1px solid #444; border-bottom-width: 2px;
    border-radius: 3px; padding: 1px 5px; color: #ddd; font-size: 11px;
  }
</style>
</head>
<body>
<div id="wrap">
  <h1>DOOM RPG &mdash; WEB PORT</h1>
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <div id="status">Loading&hellip;</div>
  <div id="help">
    <b>Move</b> <kbd>&uarr;</kbd><kbd>&darr;</kbd> &middot;
    <b>Turn</b> <kbd>&larr;</kbd><kbd>&rarr;</kbd> &middot;
    <b>Strafe</b> <kbd>A</kbd><kbd>D</kbd> &middot;
    <b>Attack / Use / Talk</b> <kbd>Enter</kbd> &middot;
    <b>Weapon</b> <kbd>Z</kbd><kbd>X</kbd> &middot;
    <b>Pass turn</b> <kbd>C</kbd> &middot;
    <b>Automap</b> <kbd>Tab</kbd> &middot;
    <b>Menu / Back</b> <kbd>Esc</kbd>.
    Click the screen to capture the mouse for look/turn (press <kbd>Esc</kbd> to release).
    Saves persist in your browser.
  </div>
</div>

<script type="text/javascript">
  var statusEl = document.getElementById('status');
  var canvas = document.getElementById('canvas');

  var Module = {
    canvas: canvas,
    arguments: [],
    // INVOKE_RUN=0: we start main() ourselves after the save FS is ready.
    noInitialRun: true,
    print: function (text) { console.log(text); },
    printErr: function (text) { console.warn(text); },
    setStatus: function (text) { if (statusEl) statusEl.textContent = text; },
    onRuntimeInitialized: function () {
      var FS = Module.FS;
      // Mount an IndexedDB-backed filesystem for the game's save files
      // (Config/Player/Player2/World) and populate it from a previous session
      // before main() runs (main chdir()s into /save).
      try { FS.mkdir('/save'); } catch (e) {}
      try {
        FS.mount(FS.filesystems.IDBFS, {}, '/save');
      } catch (e) {
        console.warn('[DoomRPG] IDBFS mount failed; saves will not persist.', e);
        Module.setStatus('');
        Module.callMain(Module.arguments);
        return;
      }
      FS.syncfs(true, function (err) {
        if (err) console.warn('[DoomRPG] initial syncfs failed:', err);
        Module.setStatus('');
        Module.callMain(Module.arguments);
      });
    }
  };

  // Resume the Web Audio context on first user gesture (browser autoplay policy).
  function resumeAudio() {
    try {
      if (Module.SDL2 && Module.SDL2.audioContext && Module.SDL2.audioContext.state === 'suspended') {
        Module.SDL2.audioContext.resume();
      }
    } catch (e) {}
  }
  canvas.addEventListener('click', function () { canvas.focus(); resumeAudio(); });
  window.addEventListener('keydown', resumeAudio, { once: true });
</script>
{{{ SCRIPT }}}
</body>
</html>
